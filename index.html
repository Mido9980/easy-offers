<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0b16">
<title>EASY OFFERS — أقوى العروض والخصومات في مكان واحد</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏷️</text></svg>">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:'Segoe UI', Tahoma, Arial, sans-serif; }
body { min-height:100vh; background:#0b0b16; color:#e8e8f0; padding-bottom:40px;
  background-image:radial-gradient(circle at 15% 5%, #1e1e40 0%, transparent 45%), radial-gradient(circle at 85% 95%, #0d2b2b 0%, transparent 45%); }
body::before { content:'EASY CODE'; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) rotate(-30deg);
  font-size:90px; font-weight:900; color:rgba(255,255,255,.015); letter-spacing:20px; pointer-events:none; white-space:nowrap; }
.wrap { max-width:800px; margin:0 auto; padding:18px; position:relative; }
.brand { text-align:center; padding:18px 0 6px; }
.logo { font-size:46px; }
h1 { font-size:26px; font-weight:800; background:linear-gradient(90deg,#ffd166,#ff6b6b); -webkit-background-clip:text; background-clip:text; color:transparent; margin-top:2px; }
.tag { color:#9a9ab8; font-size:13px; margin-top:5px; }
.chips { display:flex; gap:8px; overflow-x:auto; padding:14px 2px; scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.chip { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); color:#c8c8dd; border-radius:20px;
  padding:8px 16px; font-size:13px; cursor:pointer; white-space:nowrap; transition:all .2s; }
.chip.on { background:linear-gradient(90deg,#ffd166,#ff6b6b); color:#0b0b16; font-weight:700; border-color:transparent; }
.grid { display:grid; grid-template-columns:1fr; gap:14px; }
@media(min-width:560px) { .grid { grid-template-columns:1fr 1fr; } }
.card { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.09); border-radius:18px; overflow:hidden;
  display:flex; flex-direction:column; transition:transform .15s; }
.card:active { transform:scale(.98); }
.img { height:130px; background:linear-gradient(135deg,#1c1c38,#252548); display:flex; align-items:center; justify-content:center;
  font-size:54px; position:relative; }
.img img { width:100%; height:100%; object-fit:cover; }
.badge { position:absolute; top:10px; right:10px; background:linear-gradient(90deg,#ff6b6b,#ffd166); color:#0b0b16;
  font-size:12px; font-weight:800; border-radius:9px; padding:5px 11px; box-shadow:0 3px 10px rgba(255,107,107,.4); }
.cat { position:absolute; bottom:10px; right:10px; background:rgba(0,0,0,.45); backdrop-filter:blur(4px);
  font-size:11px; color:#c8c8dd; border-radius:7px; padding:3px 9px; }
.info { padding:14px 15px 16px; display:flex; flex-direction:column; flex:1; }
.info h3 { font-size:16px; font-weight:700; margin-bottom:5px; }
.info p { font-size:12.5px; color:#9a9ab8; line-height:1.6; flex:1; }
.prices { display:flex; align-items:baseline; gap:9px; margin:12px 0 12px; direction:rtl; }
.new { font-size:21px; font-weight:800; color:#00d9c0; }
.new span { font-size:12px; font-weight:400; color:#9a9ab8; }
.old { font-size:13.5px; color:#77779a; text-decoration:line-through; }
.go { width:100%; background:linear-gradient(90deg,#ffd166,#ff6b6b); border:none; border-radius:12px; padding:13px;
  color:#0b0b16; font-size:15px; font-weight:800; cursor:pointer; transition:transform .1s, opacity .2s; }
.go:active { transform:scale(.97); }
.go[disabled] { opacity:.45; }
.empty { text-align:center; color:#77779a; padding:50px 20px; font-size:14px; line-height:1.8; }
.foot { text-align:center; margin-top:26px; font-size:11px; color:#55556e; letter-spacing:1px; line-height:1.9; }
.foot a { color:#7c6cff; text-decoration:none; }
.loading { text-align:center; color:#77779a; padding:50px 0; font-size:15px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="logo">🏷️</div>
    <h1>EASY OFFERS</h1>
    <div class="tag">كل العروض والخصومات من كل المواقع في مكان واحد 🔥</div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"><div class="loading">⏳ بنجهّز لك أحسن العروض...</div></div>
  <div class="foot">
    EASY CODE — APPS MADE EASY<br>
    <a href="https://mido9980.github.io/">كل منتجاتنا</a> · <a href="https://mido9980.github.io/easy-pay/">ادفع بسهولة</a>
  </div>
</div>
<script>
const API = 'https://shark-vision-labs.base44.app/functions/offersPublic';
const ICONS = { 'إلكترونيات':'🎧', 'موضة':'🎒', 'اشتراكات':'🎬', 'تطبيقات وألعاب':'🎮', 'منزل':'🏠', 'عطور':'🧴', 'كتب':'📚', 'رياضة':'⚽', 'عناية شخصية':'💈' };
let OFFERS = [], CAT = 'الكل';

async function boot(retry) {
  let c;
  try { c = await (await fetch(API)).json(); }
  catch(e) { if (!retry) setTimeout(() => boot(true), 2500); return; }
  OFFERS = (c.offers || []);
  if (!OFFERS.length && !retry) { setTimeout(() => boot(true), 2500); return; }
  renderChips(); render();
}
function renderChips() {
  const cats = ['الكل', ...new Set(OFFERS.map(o => o.category).filter(Boolean))];
  document.getElementById('chips').innerHTML = cats.map(cat =>
    `<div class="chip ${cat === CAT ? 'on' : ''}" onclick="setCat('${cat}')">${cat}</div>`).join('');
}
function setCat(cat) { CAT = cat; renderChips(); render(); }
function render() {
  const g = document.getElementById('grid');
  const list = CAT === 'الكل' ? OFFERS : OFFERS.filter(o => o.category === CAT);
  if (!list.length) { g.innerHTML = '<div class="empty">مفيش عروض في القسم ده حالياً 🙈<br>جرّب قسم تاني أو ارجع قريب!</div>'; return; }
  g.innerHTML = list.map(o => {
    const img = o.image_url ? `<img src="${o.image_url}" alt="" loading="lazy">` : (ICONS[o.category] || '🎁');
    const prices = o.new_price ? `<div class="prices"><div class="new">${o.new_price} <span>جنيه</span></div>${o.old_price ? `<div class="old">${o.old_price}</div>` : ''}</div>` : '';
    const btn = o.url ? `<button class="go" onclick="grab('${o.id}')">🛒 خد العرض دلوقتي</button>`
                      : `<button class="go" disabled>⏳ العرض قريب جداً</button>`;
    return `<div class="card"><div class="img">${img}${o.discount_text ? `<div class="badge">${o.discount_text}</div>` : ''}${o.category ? `<div class="cat">${o.category}</div>` : ''}</div>
      <div class="info"><h3>${o.name}</h3><p>${o.description}</p>${prices}${btn}</div></div>`;
  }).join('');
}
async function grab(id) {
  try {
    const r = await (await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'click', offer_id: id }) })).json();
    if (r.url) window.open(r.url, '_blank', 'noopener');
  } catch(e) {}
}
boot();
</script>
</body>
</html>
